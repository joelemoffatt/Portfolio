<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>

  <g clip-path="url(#c)">
    <!-- Light blue sky -->
    <rect width="100" height="100" fill="#D2E5EF"/>

    <!-- Dark blue ocean with wave -->
    <path d="M0 42 C18 67, 38 29, 50 51 C62 71, 82 29, 100 42 L100 100 L0 100 Z" fill="#0066CC"/>

    <!-- Bubbles — lifted clear of circle edge -->
    <circle cx="25" cy="68" r="8"  fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
    <circle cx="38" cy="80" r="4"  fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <circle cx="58" cy="72" r="6"  fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5"/>
    <circle cx="74" cy="80" r="3"  fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.8"/>
    <circle cx="82" cy="66" r="7"  fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
  </g>

  <!-- Even border, fully inside circle -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#0066CC" stroke-width="6"/>
</svg>
